name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  INNER: cursor-projects/DOT-Copilot

jobs:
  frontend-ci:
    name: Canonical Frontend (Root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3001/api

  backend-ci:
    name: Backend Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dot_copilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.INNER }}/backend/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.INNER }}/backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: ${{ env.INNER }}/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dot_copilot_test?schema=public
        run: npx prisma generate

      - name: Run migrations
        working-directory: ${{ env.INNER }}/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dot_copilot_test?schema=public
        run: npx prisma migrate deploy

      - name: Run linting
        working-directory: ${{ env.INNER }}/backend
        run: npm run lint

      - name: Run tests
        working-directory: ${{ env.INNER }}/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dot_copilot_test?schema=public
          JWT_SECRET: test-secret-key-32-characters-minimum
          JWT_REFRESH_SECRET: test-refresh-secret-32-characters
        run: npm test

      - name: Build
        working-directory: ${{ env.INNER }}/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dot_copilot_test?schema=public
        run: npm run build

  frontend-lint-test:
    name: Inner frontend Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.INNER }}/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.INNER }}/frontend
        run: npm ci

      - name: Run linting
        working-directory: ${{ env.INNER }}/frontend
        run: npm run lint

      - name: Run tests
        working-directory: ${{ env.INNER }}/frontend
        run: npm test

      - name: Build
        working-directory: ${{ env.INNER }}/frontend
        env:
          VITE_API_BASE_URL: http://localhost:3001
        run: npm run build

  docker-build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ env.INNER }}/backend
          push: false
          tags: dot-copilot-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Run Trivy vulnerability scanner - Backend
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: 'dot-copilot-backend:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy results - Backend
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-backend-results.sarif'
          category: 'backend-container'
